<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Thread — Connectly</title>
  <meta name="description" content="View post conversation on Connectly." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand">
        <div class="brand-icon">C</div>
        <span>Connectly</span>
      </a>
      <div id="navbar-actions" class="nav-actions">
        <!-- Injected dynamically by main.js -->
      </div>
    </div>
  </header>

  <main class="app-container single-column" style="margin-top: 24px;">
    <div style="margin-bottom: 16px;">
      <a href="/index.html" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 6px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Feed
      </a>
    </div>

    <!-- Post Details Card -->
    <div id="single-post-container">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        Loading post conversation...
      </div>
    </div>

    <!-- Full Comment Thread Section -->
    <div class="sidebar-card" style="margin-top: 20px;">
      <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Comments (<span id="thread-comment-count">0</span>)
      </h3>

      <div id="add-comment-box" style="margin-bottom: 24px;">
        <!-- Injected based on auth status -->
      </div>

      <div id="thread-comments-list" class="comments-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav">
    <!-- Populated by main.js -->
  </nav>

  <script type="module">
    import { api } from '/js/api.js';
    import { auth } from '/js/auth.js';
    import { posts } from '/js/posts.js';
    import { showToast, escapeHTML, formatRelativeTime, confirmAction } from '/js/main.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');

      if (!postId) {
        window.location.href = '/index.html';
        return;
      }

      await loadPostThread(postId);
    });

    async function loadPostThread(postId) {
      const container = document.getElementById('single-post-container');
      const commentCountBadge = document.getElementById('thread-comment-count');
      const addCommentBox = document.getElementById('add-comment-box');
      const commentsList = document.getElementById('thread-comments-list');

      try {
        const res = await api.posts.getById(postId);
        if (!res.success || !res.data) {
          container.innerHTML = `
            <div class="empty-state">
              <h3 class="empty-state-title">Post Not Found</h3>
              <p class="empty-state-text">This post may have been deleted or is no longer available.</p>
              <a href="/index.html" class="btn btn-primary btn-sm">Return to Feed</a>
            </div>
          `;
          return;
        }

        const post = res.data;
        container.innerHTML = posts.renderPostCard(post);
        posts.bindPostEvents(container);

        // Setup Add Comment Box
        if (auth.isAuthenticated()) {
          const currentUser = auth.getUser();
          addCommentBox.innerHTML = `
            <form id="standalone-comment-form" style="display: flex; gap: 12px; align-items: flex-start;">
              <img src="${currentUser.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(currentUser.name)}`}" class="avatar" alt="Avatar" />
              <div style="flex: 1;">
                <textarea id="standalone-comment-text" rows="2" placeholder="Write your thoughts..." maxlength="300" required style="resize: vertical;"></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                  <span id="standalone-comment-counter" style="font-size: 0.78rem; color: var(--text-muted);">0/300</span>
                  <button type="submit" id="standalone-comment-submit" class="btn btn-primary btn-sm">Post Comment</button>
                </div>
              </div>
            </form>
          `;

          const commentInput = document.getElementById('standalone-comment-text');
          const commentCounter = document.getElementById('standalone-comment-counter');
          commentInput.addEventListener('input', () => {
            commentCounter.textContent = `${commentInput.value.length}/300`;
          });

          document.getElementById('standalone-comment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = commentInput.value.trim();
            if (!text) return;

            const submitBtn = document.getElementById('standalone-comment-submit');
            submitBtn.disabled = true;

            try {
              const cRes = await api.comments.create(postId, text);
              if (cRes.success && cRes.data) {
                commentInput.value = '';
                commentCounter.textContent = '0/300';
                await loadComments(postId);
                showToast('Comment added!', 'success');
              }
            } catch (err) {
              showToast(err.message || 'Failed to post comment', 'error');
            } finally {
              submitBtn.disabled = false;
            }
          });
        } else {
          addCommentBox.innerHTML = `
            <div style="background-color: var(--bg-tertiary); padding: 14px; border-radius: var(--radius-md); text-align: center; font-size: 0.9rem;">
              <a href="/login.html" style="color: var(--primary); font-weight: 700;">Log in</a> or 
              <a href="/register.html" style="color: var(--primary); font-weight: 700;">create an account</a> to join the conversation.
            </div>
          `;
        }

        await loadComments(postId);
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state" style="color: var(--accent-red);">
            <h3>Error loading post</h3>
            <p>${escapeHTML(err.message)}</p>
          </div>
        `;
      }
    }

    async function loadComments(postId) {
      const list = document.getElementById('thread-comments-list');
      const countBadge = document.getElementById('thread-comment-count');

      try {
        const res = await api.comments.getByPost(postId);
        if (res.success && res.data) {
          countBadge.textContent = res.data.length;
          if (res.data.length === 0) {
            list.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 0.9rem;">No comments yet. Be the first to reply!</div>`;
            return;
          }

          list.innerHTML = res.data.map(c => posts.renderCommentItem(c)).join('');
          posts.bindCommentEvents(list);
        }
      } catch (err) {
        list.innerHTML = `<div style="color: var(--accent-red); font-size: 0.85rem;">Failed to load comments</div>`;
      }
    }
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
