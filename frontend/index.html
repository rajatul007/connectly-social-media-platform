<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connectly — Mini Social Media Platform</title>
  <meta name="description" content="Connectly is a modern, responsive social media platform for sharing thoughts, connecting with developers, and exploring engaging content." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand">
        <div class="brand-icon">C</div>
        <span>Connectly</span>
      </a>

      <!-- Search Input with Dropdown -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="global-search-input" class="search-input" placeholder="Search people by name or username..." autocomplete="off" />
          <button id="search-clear-btn" class="search-clear-btn" title="Clear search">✕</button>
        </div>
        <div id="search-results-dropdown" class="search-results-dropdown"></div>
      </div>

      <!-- Nav Actions / User Badge -->
      <div id="navbar-actions" class="nav-actions">
        <!-- Injected dynamically by main.js -->
      </div>
    </div>
  </header>

  <!-- 3-Column Social Feed Layout -->
  <main class="app-container">
    <!-- Left Sidebar: Profile Summary & Navigation -->
    <aside class="left-sidebar">
      <div id="sidebar-profile-container">
        <!-- Rendered by feed.js -->
      </div>

      <div class="sidebar-card">
        <nav class="sidebar-nav">
          <a href="/index.html" class="sidebar-nav-link active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home Feed</span>
          </a>
          <a href="/create-post.html" class="sidebar-nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
            <span>Create Post</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-card" style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.5;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <strong style="color: var(--text-secondary);">Demo Controls</strong>
          <span style="font-size: 0.7rem; background: var(--bg-accent); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: 700;">DEV</span>
        </div>
        <p style="margin-bottom: 12px;">Reset sample users, posts, and comments back to default state:</p>
        <button id="reseed-demo-btn" class="btn btn-secondary btn-sm" style="width: 100%;">
          Reset Demo Data
        </button>
      </div>
    </aside>

    <!-- Center Column: Create Post Box & Social Feed -->
    <section class="main-feed">
      <!-- Create Post Box -->
      <div class="create-post-card" id="create-post-card">
        <form id="create-post-form">
          <div class="create-post-header">
            <img id="create-post-avatar" src="https://api.dicebear.com/7.x/initials/svg?seed=User" class="avatar" alt="My avatar" />
            <div style="flex: 1;">
              <textarea id="post-content-input" class="create-post-textarea" placeholder="What's happening in your dev journey?" maxlength="500"></textarea>
            </div>
          </div>

          <!-- Image Preview -->
          <div id="image-preview-container" class="image-preview-container">
            <button type="button" id="remove-image-btn" class="remove-image-btn" title="Remove image">✕</button>
            <img id="image-preview" src="" alt="Preview" />
          </div>

          <!-- URL Input for Image Attachment -->
          <div id="image-input-row" class="create-post-image-input-row">
            <input type="url" id="image-url-input" placeholder="Paste image URL (Unsplash, imgur, etc.)..." />
          </div>

          <div class="create-post-footer">
            <div style="display: flex; align-items: center; gap: 8px;">
              <button type="button" id="toggle-image-input-btn" class="btn-icon" title="Add image URL" style="width: 32px; height: 32px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              </button>
              <span id="char-counter" class="char-counter">0/500</span>
            </div>
            <button type="submit" id="submit-post-btn" class="btn btn-primary btn-sm" disabled>Post</button>
          </div>
        </form>
      </div>

      <!-- Feed Filter Tabs -->
      <div class="feed-tabs">
        <button class="feed-tab active" data-feed="all">Discover Feed</button>
        <button class="feed-tab" data-feed="following">Following Only</button>
      </div>

      <!-- Posts List -->
      <div id="feed-posts-list" style="display: flex; flex-direction: column; gap: 20px;">
        <!-- Rendered by feed.js -->
      </div>

      <!-- Load More Button -->
      <div style="text-align: center; margin-top: 10px;">
        <button id="load-more-posts-btn" class="btn btn-secondary" style="display: none; padding: 10px 24px;">
          Load More Posts
        </button>
      </div>
    </section>

    <!-- Right Sidebar: Suggested Connections & Trending -->
    <aside class="right-sidebar">
      <div class="sidebar-card">
        <h4 style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          Who to follow
        </h4>
        <div id="suggested-users-container" class="suggested-users-list">
          <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Loading suggestions...</p>
        </div>
      </div>

      <div class="sidebar-card" style="font-size: 0.85rem;">
        <h4 style="font-weight: 700; margin-bottom: 10px; color: var(--text-primary);">Internship Tech Stack</h4>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">Node.js</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">Express.js</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">MongoDB</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">JWT Auth</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">Bcrypt</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">Vanilla JS</span>
          <span style="background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-weight: 600;">Modern CSS</span>
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav">
    <!-- Populated by main.js -->
  </nav>

  <!-- Scripts -->
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/feed.js"></script>
</body>
</html>
