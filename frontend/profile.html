<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — Connectly</title>
  <meta name="description" content="User profile on Connectly Social Platform." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand">
        <div class="brand-icon">C</div>
        <span>Connectly</span>
      </a>

      <!-- Search Input with Dropdown -->
      <div class="search-container">
        <div class="search-input-wrapper">
          <span class="search-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </span>
          <input type="text" id="global-search-input" class="search-input" placeholder="Search people by name or username..." autocomplete="off" />
          <button id="search-clear-btn" class="search-clear-btn">✕</button>
        </div>
        <div id="search-results-dropdown" class="search-results-dropdown"></div>
      </div>

      <div id="navbar-actions" class="nav-actions">
        <!-- Injected dynamically by main.js -->
      </div>
    </div>
  </header>

  <!-- Profile Page Content -->
  <main class="app-container single-column" style="margin-top: 24px;">
    <!-- Profile Header Banner & Details -->
    <div id="profile-header-container">
      <!-- Populated by profile.js -->
      <div style="text-align: center; padding: 60px; color: var(--text-muted);">
        Loading profile...
      </div>
    </div>

    <!-- Tab Content (Posts, Followers, Following) -->
    <div id="profile-tab-content">
      <!-- Injected by profile.js based on active tab -->
    </div>
  </main>

  <!-- Edit Profile Modal Overlay -->
  <div id="edit-profile-modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Edit Profile</h3>
        <button id="close-edit-modal-btn" class="btn-icon">✕</button>
      </div>

      <form id="edit-profile-form">
        <div class="form-group">
          <label class="form-label" for="edit-name-input">Full Name</label>
          <input type="text" id="edit-name-input" required maxlength="50" />
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-avatar-input">Avatar Image URL</label>
          <input type="url" id="edit-avatar-input" placeholder="https://images.unsplash.com/..." />
          <small style="color: var(--text-muted); font-size: 0.78rem;">Leave blank to use auto-generated initials badge</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-bio-input">Bio (Max 160 characters)</label>
          <textarea id="edit-bio-input" rows="3" maxlength="160" placeholder="Tell the world about what you're creating..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('edit-profile-modal-overlay').classList.remove('open')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav id="mobile-bottom-nav" class="mobile-bottom-nav">
    <!-- Populated by main.js -->
  </nav>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/profile.js"></script>
</body>
</html>
